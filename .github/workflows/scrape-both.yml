name: Scrape Both (Movies + Series)

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      start_page:
        description: 'Start page (default: 1)'
        required: false
        default: '1'
      end_page:
        description: 'End page (0 = auto-detect from site)'
        required: false
        default: '0'
      resume:
        description: 'Resume from last scraped page'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
      debug:
        description: 'Dump HTML structure on empty pages (true/false)'
        required: false
        default: 'false'

jobs:
  scrape-movies:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scrape movies
        env:
          SCRAPE_TYPE:  movies
          START_PAGE:   ${{ github.event.inputs.start_page  || '1' }}
          END_PAGE:     ${{ github.event.inputs.end_page    || '0' }}
          RESUME:       ${{ github.event.inputs.resume      || 'true' }}
          SCRAPE_DEBUG: ${{ github.event.inputs.debug       || 'false' }}
          DELAY_MIN:    '2.0'
          DELAY_MAX:    '4.0'
        run: python scraper/scraper.py

      - name: Commit movies
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add data/movies.json
          git diff --cached --quiet || git commit -m "chore: update movies [$(date -u '+%Y-%m-%d')] [skip ci]"
          git push

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: movies-${{ github.run_number }}
          path: data/movies.json
          retention-days: 30

  scrape-series:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: scrape-movies          # runs after movies job finishes — avoids push conflicts
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scrape series
        env:
          SCRAPE_TYPE:  series
          START_PAGE:   ${{ github.event.inputs.start_page  || '1' }}
          END_PAGE:     ${{ github.event.inputs.end_page    || '0' }}
          RESUME:       ${{ github.event.inputs.resume      || 'true' }}
          SCRAPE_DEBUG: ${{ github.event.inputs.debug       || 'false' }}
          DELAY_MIN:    '2.0'
          DELAY_MAX:    '4.0'
        run: python scraper/scraper.py

      - name: Commit series
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add data/series.json
          git diff --cached --quiet || git commit -m "chore: update series [$(date -u '+%Y-%m-%d')] [skip ci]"
          git push

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: series-${{ github.run_number }}
          path: data/series.json
          retention-days: 30
