name: Scrape New Movies

on:
  schedule:
    # Runs every day at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      start_page:
        description: 'Start page (default: 1)'
        required: false
        default: '1'
      end_page:
        description: 'End page (0 = last known page)'
        required: false
        default: '0'
      resume:
        description: 'Resume from last scraped page (true/false)'
        required: false
        default: 'true'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # just under 6h Actions limit

    permissions:
      contents: write       # needed to git push results back

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper (movies)
        env:
          SCRAPE_TYPE: movies
          START_PAGE:  ${{ github.event.inputs.start_page || '1' }}
          END_PAGE:    ${{ github.event.inputs.end_page   || '0' }}
          RESUME:      ${{ github.event.inputs.resume     || 'true' }}
          DELAY_MIN:   '2.0'
          DELAY_MAX:   '4.0'
        run: python scraper/scraper.py

      - name: Commit & push results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/movies.json
          git diff --cached --quiet || git commit -m "chore: update movies data [$(date -u '+%Y-%m-%d %H:%M')] [skip ci]"
          git push

      - name: Upload artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movies-data-${{ github.run_number }}
          path: data/movies.json
          retention-days: 30
